<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>CESI+</title>
<style>
  @font-face { font-family: "Fredoka"; font-weight: 300 700; src: url("fonts/fredoka.woff2") format("woff2"); }
  :root {
    --yellow: #ffcf06; --charcoal: #232323; --stone: #e9e4d2; --cream: #fffce9; --coral: #ff6b4a; --lilac: #b69cff;
    --bg: #faf7ec; --surface: #ffffff; --surface-2: #f3efe0; --ink: #232323; --muted: #8f8a7b; --line: #e9e4d2;
    --font: "Fredoka", ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #171716; --surface: #232323; --surface-2: #2c2b28; --ink: #fffce9; --line: #34332f; }
  }
  * { box-sizing: border-box; }
  body { width: 310px; margin: 0; padding: 14px; background: var(--bg); color: var(--ink); font: 400 15px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
  .hero { position: relative; overflow: hidden; margin-bottom: 12px; padding: 18px 20px 22px; border-radius: 26px; background: var(--yellow); color: var(--charcoal); }
  .hero::after { content: ""; position: absolute; right: -40px; bottom: -60px; width: 150px; height: 150px; border-radius: 50%; background: rgba(255, 252, 233, .45); }
  .brand { font-size: 22px; font-weight: 700; letter-spacing: -.02em; }
  .dot { display: inline-block; width: .24em; height: .24em; margin-left: .05em; border-radius: 50%; background: var(--cream); }
  .brand .dot { background: var(--charcoal); }
  h1 { position: relative; z-index: 1; margin: 14px 0 0; font-size: 40px; font-weight: 700; line-height: .95; letter-spacing: -.03em; }
  .card { margin-bottom: 10px; padding: 14px 16px; border-radius: 22px; background: var(--surface); box-shadow: 0 0 0 1.5px var(--line); }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-weight: 600; cursor: pointer; }
  .label { margin-bottom: 10px; font-weight: 600; }
  .switch { position: relative; width: 48px; height: 28px; flex: none; }
  .switch input { position: absolute; inset: 0; margin: 0; opacity: 0; cursor: pointer; }
  .switch i { position: absolute; inset: 0; border-radius: 999px; background: var(--surface-2); transition: background .2s; pointer-events: none; }
  .switch i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--muted); transition: transform .25s cubic-bezier(.34, 1.56, .64, 1), background .2s; }
  .switch input:checked + i { background: var(--charcoal); }
  .switch input:checked + i::after { background: var(--yellow); transform: translateX(20px); }
  .switch input:focus-visible + i { outline: 2px solid var(--charcoal); outline-offset: 2px; }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; border-radius: 999px; background: var(--surface-2); }
  .seg button { height: 34px; border: 0; border-radius: 999px; background: transparent; color: var(--ink); font: 500 14px var(--font); cursor: pointer; transition: background .2s; }
  .seg button[aria-pressed="true"] { background: var(--yellow); color: var(--charcoal); font-weight: 600; }
  .login-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .login-row small { overflow: hidden; color: var(--muted); font-size: 13.5px; text-overflow: ellipsis; white-space: nowrap; }
  .link { flex: none; height: 30px; padding: 0 12px; border: 0; border-radius: 999px; background: var(--charcoal); color: var(--cream); font: 600 13px var(--font); cursor: pointer; }
  [hidden] { display: none !important; }
  footer { display: flex; align-items: center; justify-content: space-between; padding: 4px 6px 0; color: var(--muted); font-size: 13px; }
  kbd { padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--ink); font: 600 12px var(--font); }
</style>
</head>
<body>
  <div class="hero">
    <div class="brand">cesi<span class="dot"></span></div>
    <h1>Réglages<span class="dot"></span></h1>
  </div>

  <label class="card row">
    <span>Nouvelle interface</span>
    <span class="switch"><input type="checkbox" id="enabled"><i></i></span>
  </label>

  <div class="card">
    <div class="label">Apparence</div>
    <div class="seg" id="theme">
      <button type="button" data-value="auto">Auto</button>
      <button type="button" data-value="light">Clair</button>
      <button type="button" data-value="dark">Sombre</button>
    </div>
  </div>

  <div class="card" id="login-block" hidden>
    <div class="label">Connexion en un clic</div>
    <div class="login-row">
      <small id="login-value"></small>
      <button type="button" class="link" id="login-forget">Oublier</button>
    </div>
  </div>

  <footer><span>Recherche rapide</span><span><kbd>⌘K</kbd> <kbd>Ctrl K</kbd></span></footer>

  <script src="popup.js"></script>
</body>
</html>
